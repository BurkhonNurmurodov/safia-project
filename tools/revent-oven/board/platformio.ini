; Safia oven board — the always-on Revent oven collector on a LOLIN S2 Mini
; (ESP32-S2FNR2: 4 MB flash, 2 MB PSRAM). See README.md.
;
;   ~/.safia-esp/venv/bin/pio run                 build
;   ~/.safia-esp/venv/bin/pio run -t upload       flash (see README for the first time)
;   ~/.safia-esp/venv/bin/pio device monitor      the USB console

[platformio]
default_envs = s2mini

[env:s2mini]
platform = espressif32@8.0.0
board = lolin_s2_mini
framework = arduino
monitor_speed = 115200
; two 1.9 MB app slots (room for Wi-Fi updates later), a small SPIFFS nobody uses
board_build.partitions = min_spiffs.csv
lib_deps = bblanchon/ArduinoJson@^7.4.2
build_flags =
  -DFW_VERSION=\"1.4.1\"
  -Wall
