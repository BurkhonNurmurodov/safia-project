import groovy.json.JsonSlurper

import javax.inject.Inject

plugins {
    id "com.android.application"
}

// The release key NEVER lives in the repo. It sits beside the toolchain in
// ~/.safia-android/signing/ on the Mac that builds the app (or wherever
// SAFIA_KEYSTORE_PROPERTIES points). Losing it means no installed copy can be
// updated again — each phone would have to uninstall and reinstall — and the
// site's /.well-known/assetlinks.json vouches for exactly this key's SHA-256.
def signingProps = new Properties()
def signingFile = file(System.getenv("SAFIA_KEYSTORE_PROPERTIES")
        ?: "${System.getProperty("user.home")}/.safia-android/signing/keystore.properties")
if (signingFile.isFile()) {
    signingFile.withInputStream { signingProps.load(it) }
}

android {
    namespace "uz.safiacorporate.ims"
    compileSdk 36
    buildToolsVersion "36.0.0"

    defaultConfig {
        // PERMANENT: Android identifies the app by it, and assetlinks.json
        // names it. Changing it makes a different app.
        applicationId "uz.safiacorporate.ims"
        // 24: androidx.webkit needs Android 7.
        minSdk 24
        targetSdk 36
        // Raise versionCode on EVERY release, or phones refuse the update.
        versionCode 4
        versionName "1.2.0"
    }

    signingConfigs {
        release {
            if (signingFile.isFile()) {
                storeFile file(signingProps["storeFile"])
                storePassword signingProps["storePassword"]
                keyAlias signingProps["keyAlias"]
                keyPassword signingProps["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// An unsigned or debug-signed package is worse than none: it cannot update an
// installed copy, and the production app link (assetlinks.json names the
// release key) would not verify.
gradle.taskGraph.whenReady { graph ->
    if (!signingFile.isFile() && graph.allTasks.any { it.name.toLowerCase().contains("release") }) {
        throw new GradleException("Release signing key not found: ${signingFile}. See CLAUDE.md «The Android app».")
    }
}

/**
 * The site's pages go INSIDE the APK (the operator's choice, 2026-09-28): the
 * committed frontend/dist is copied to assets/web, where WebBundle.java serves
 * it at the production address until PageUpdates.java has downloaded a build
 * the site deployed since. Three checks keep the built-in copy honest:
 *
 *  - the copy must BE the build production is serving right now — the pages
 *    talk to that server's API, so a copy of anything else (an undeployed
 *    local build, a checkout behind main) is refused, unless
 *    SAFIA_ALLOW_UNDEPLOYED=1 says so on purpose;
 *  - it must carry build-files.json for that same build — every file's
 *    SHA-256, by which a newly deployed build downloads only what changed;
 *  - the server's own Content-Security-Policy is read from the live site and
 *    frozen with the pages it was written for.
 *
 * sw.js stays out: the app never runs a service worker.
 */
abstract class BundleWebTask extends DefaultTask {
    @InputDirectory
    abstract DirectoryProperty getDist()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @Inject
    abstract FileSystemOperations getFs()

    @TaskAction
    void bundle() {
        File dist = getDist().get().asFile
        File out = getOutputDir().get().asFile
        fs.delete { delete out }
        fs.copy {
            from dist
            into new File(out, "web")
            exclude "sw.js"
        }
        def local = new JsonSlurper().parse(new File(dist, "build.json"))
        File listFile = new File(dist, "build-files.json")
        if (!listFile.isFile() || new JsonSlurper().parse(listFile).buildTime != local.buildTime) {
            throw new GradleException("frontend/dist has no build-files.json for its own build: build the " +
                    "frontend again (cd frontend && npx vite build).")
        }
        def live = new JsonSlurper().parse(new URL("https://production.safiacorporate.uz/build.json"))
        if (local.buildTime != live.buildTime && System.getenv("SAFIA_ALLOW_UNDEPLOYED") != "1") {
            throw new GradleException("frontend/dist is ${local.version} (${local.buildTime}) but production serves " +
                    "${live.version} (${live.buildTime}). The app must carry the deployed pages: pull, let the deploy " +
                    "finish, and build again.")
        }
        String csp = new URL("https://production.safiacorporate.uz/").openConnection()
                .getHeaderField("Content-Security-Policy")
        if (!csp) throw new GradleException("Could not read the live site's Content-Security-Policy.")
        new File(out, "csp.txt").text = csp
        logger.lifecycle("Bundled pages ${local.version} (${local.buildTime}) with the live CSP.")
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def bundleWeb = project.tasks.register("bundleWeb${variant.name.capitalize()}", BundleWebTask) {
            dist.set(rootProject.file("../frontend/dist"))
            // It asks the live server every time: that check is the point.
            outputs.upToDateWhen { false }
        }
        variant.sources.assets?.addGeneratedSourceDirectory(bundleWeb, { it.outputDir })
    }
}

dependencies {
    // Pinned where the next release needs a newer toolchain than AGP 8.13 /
    // compileSdk 36: core 1.19 wants compileSdk 37 and AGP 9.1.
    implementation "androidx.activity:activity:1.13.0"
    implementation "androidx.core:core:1.18.0"
    implementation "androidx.webkit:webkit:1.17.1"
}
