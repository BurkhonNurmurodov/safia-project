      // box (#boot-debug): the slow-connection loader (bundle still arriving),
      // the stale-version countdown (a hashed chunk is gone), the recovery
      // card (something really failed) and, inside it, the outdated-engine
      // notice. Every one of them is torn down the moment React paints.

        try {
          if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
          }
        } catch (e) {}

        // code-split, and dynamic import() is syntax Vite never down-levels
        // (App.jsx lazyWithReload). Telegram Desktop falls back to exactly
        // these engines on Windows machines without the WebView2 runtime —
        // EdgeHTML ("Edge/18") or MSHTML ("Trident"). For them "Retry" can
        // never succeed, so report() swaps to an "outdated Windows browser"
        // notice naming the real ways out. UA first (works under any CSP),
        // then a syntax probe for other pre-Chrome-63 WebViews; the probe
        // counts only a SyntaxError, so a CSP that blocks eval (EvalError)
        // can never flag a modern engine.
        var engineTooOld = /\bEdge\/1[0-8]\.|\bTrident\//.test(navigator.userAgent);
        if (!engineTooOld) {
          try { new Function('return import("x")'); }
          catch (e) { if (e instanceof SyntaxError) engineTooOld = true; }
        }

        // Everything that must ARRIVE before main.jsx can run: the entry module
        // plus the static deps Vite lists as modulepreload. Resource Timing
        // says which of them have finished — the difference between "the
        // bundle is still coming down a slow link" and "it came and never ran".
        // DOM .src/.href are already absolute, which is what the timing
        // entries are keyed by (no URL constructor here — ES5 engines).
        function bootGraph() {
          var urls = [];
          try {
            var s = document.querySelector('script[type="module"][src]');
            if (s && s.src) urls.push(s.src);
            var links = document.querySelectorAll('link[rel="modulepreload"][href]');
            for (var i = 0; i < links.length; i++) if (links[i].href) urls.push(links[i].href);
          } catch (e) {}
          return urls;
        }
        // null = can't tell (no Resource Timing); else { done, pending[], lastEnd, lines[] }.
        function graphStatus() {
          if (!(window.performance && typeof performance.getEntriesByName === 'function')) return null;
          var urls = bootGraph();
          if (!urls.length) return null;
          var pending = [], lastEnd = 0, lines = [];
          for (var i = 0; i < urls.length; i++) {
            var name = urls[i].split('/').pop();
            var list = performance.getEntriesByName(urls[i]);

            if (e && e.responseEnd) {

              lines.push(name + ': done @' + (e.responseEnd / 1000).toFixed(1) + 's' +
                (e.transferSize ? ' (' + Math.round(e.transferSize / 1024) + ' KB)' : ''));
            } else {
              pending.push(name);
              lines.push(name + ': PENDING');
            }

        }

          } catch (e) {}

          // reports has to answer — a stage of 'react-render-called' only says
          // render() was called, not that it produced anything.
          try {
            var _root = document.getElementById('root');
            info.push('mounted: ' + (!_root ? 'no #root element'
              : _root.childNodes.length ? 'yes (' + _root.childNodes.length + ' nodes)' : 'NO - #root empty'));

        // never loaded. Theme mirrors the in-app localStorage 'theme'.

        }
        // Plain-language recovery copy in the 4 app languages (no exception

        var BOOT_STRINGS = {

          uz_cyrl: { title: "Илова юкланмади", msg: "Алоқа узилди ва илова тўлиқ очилмади. Бу одатда ўзи тузалади — қайта уриниб кўринг.", retry: "Қайта уриниш", reopen: "Иловани қайта очиш", report: "Муаммони юбориш", sent: "Юборилди — жамоага хабар борди", copied: "Нусха олинди", details: "Техник маълумот", oldTitle: "Компьютер браузери жуда эски", oldMsg: "Бу компьютерда Telegram Windows тизимининг эскирган ички браузерида ишлаяпти — илова унда ишга туша олмайди. Иловани телефондаги Telegram орқали очинг ёки сайтга оддий браузер орқали киринг:", oldHint: "IT учун: Microsoft Edge WebView2 ўрнатилса, Telegram Desktop ҳам ишлайди.", slowTitle: "Юкланмоқда…", slowMsg: "Алоқа секин — илова одатдагидан узоқроқ очилмоқда. Бироз кутинг.", netTitle: "Серверга уланиб бўлмади", netMsg: "Илова серверга улана олмади — алоқа узилди ёки тармоқ уни тўсиб қўйди. Бошқа тармоққа (мобил интернет ёки Wi‑Fi) ўтиб, қайта уриниб кўринг.", newTitle: "Янги версия чиқди", newMsg: "Янгиланмоқда… ({n})", updTitle: "Янгиланиш керак", updMsg: "Иловани ёпиб, қайтадан очинг." },

          en:      { title: "The app didn’t load", msg: "The connection dropped and the app didn’t finish loading. This usually fixes itself — try again.", retry: "Try again", reopen: "Reopen the app", report: "Report the problem", sent: "Sent — the team was notified", copied: "Copied", details: "Technical details", oldTitle: "Outdated Windows browser", oldMsg: "Telegram on this computer runs on Windows’ outdated built-in browser, so the app can’t start here. Open it in Telegram on your phone, or sign in from a regular browser:", oldHint: "For IT: installing Microsoft Edge WebView2 also fixes Telegram Desktop.", slowTitle: "Loading…", slowMsg: "Slow connection — the app is taking longer than usual to open. Please wait a moment.", netTitle: "Can’t reach the server", netMsg: "The app couldn’t reach the server — the connection was dropped or blocked by your network. Try a different network (mobile data or Wi‑Fi) and retry.", newTitle: "A new version is available", newMsg: "Reloading… ({n})", updTitle: "Update needed", updMsg: "Please close and reopen the app." }

        function bootLang() {

          try { l = localStorage.getItem('lang') || ''; } catch (e) {}

          var code = '';
          try {
            var u = window.Telegram && window.Telegram.WebApp &&
              window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user;
            code = (u && u.language_code) || navigator.language || '';
          } catch (e) {}
          code = String(code).toLowerCase();
          if (code.indexOf('ru') === 0) return 'ru';
          if (code.indexOf('en') === 0) return 'en';
          return 'uz';

        // build after a redeploy (old index.html/bundle references hashes the
        // server has already pruned). Instead of the scary red diagnostics,
        // show a calm "new version" notice and reload once. Guarded so a reload
        // that can't fix it (e.g. a cached index.html still pointing at old
        // hashes) shows a "reopen the app" message instead of looping forever.

          // ThemeContext reads; default dark) and the branded <PageLoader/> so
          // this screen looks like the app, not a raw dark box. Fully
          // self-contained: assumes NONE of the bundle's CSS is available (its
          // hashed stylesheet may be stale too), so colors + keyframes are inline.
          var p = palette();
          ensureAnims();

          function overlay(spinner, title, sub) { return brandedOverlay(p, spinner, title, sub); }

          var last = 0;
          try { last = Number(sessionStorage.getItem(KEY) || 0); } catch (e) {}

            'position:fixed;top:0;right:0;bottom:0;left:0;z-index:99999;' +
            'display:flex;align-items:center;justify-content:center;' +

            "font:15px/1.6 -apple-system,BlinkMacSystemFont,'Inter',sans-serif");

          if (reloadDidNotHelp) {
            box.innerHTML = overlay(false, S.updTitle, S.updMsg);
            return;

          // Paint once (stable logo — no flicker) and tick only the countdown.
          var n = 5;
          box.innerHTML = overlay(true, S.newTitle,
            S.newMsg.replace('{n}', '<span id="safia-count">' + n + '</span>'));
          var timer = setInterval(function () {
            n -= 1;
            if (n > 0) {
              var c = document.getElementById('safia-count');
              if (c) c.textContent = n;
              return;
            }
            clearInterval(timer);
            try { sessionStorage.setItem(KEY, String(Date.now())); } catch (e) {}

            // (e.g. the nginx microcache) that might otherwise re-serve the
            // same stale index.html and dead-end the reload.
            location.replace(location.pathname + '?v=' + Date.now() + location.hash);

              'fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                '<path d="M12 20h.01"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/>' +

              '<div style="margin-top:10px;font-size:15px;font-weight:600;letter-spacing:0.2px;color:' +
              p.brand + '">' + location.host + '</div>' +
              '<div style="margin-top:6px;font-size:12px;line-height:1.5;color:' + p.text3 + '">' +

          } else {
            midHtml =
              '<div>' +
                '<div style="font-size:17px;font-weight:600;color:' + p.text1 + '">' + S.title + '</div>' +
                '<div style="margin-top:8px;font-size:14px;line-height:1.6;color:' + p.text3 + '">' +
                  S.msg + '</div>' +
              '</div>' +
              '<button id="boot-retry" type="button" style="width:100%;padding:12px;border:none;' +
              'border-radius:12px;background:' + p.brand + ';color:' + p.onBrand + ';font-size:14px;' +
              'font-weight:600;cursor:pointer">' + S.retry + '</button>' +
              '<button id="boot-reopen" type="button" style="width:100%;padding:11px;' +
              'border:1px solid ' + p.border + ';border-radius:12px;background:transparent;color:' +
              p.text1 + ';font-size:14px;font-weight:500;cursor:pointer">' + S.reopen + '</button>';
          }
          box.innerHTML =
            '<div style="width:100%;max-width:320px;display:flex;flex-direction:column;' +
            'align-items:center;text-align:center;gap:16px">' +
              '<img src="/logo.png" alt="Safia" style="width:76px;height:76px;' +
              'border-radius:9999px;object-fit:cover;box-shadow:0 8px 32px rgba(0,0,0,0.18)"/>' +
              midHtml +
              '<button id="boot-report" type="button" style="width:100%;margin-top:8px;padding:8px;border:none;' +
              'background:transparent;color:' + p.text3 + ';font-size:13px;cursor:pointer">' +
                S.report + '</button>' +
              '<button id="boot-toggle" type="button" style="background:none;border:none;color:' +
              p.text3 + ';font-size:12px;cursor:pointer;opacity:.75">' + S.details + '</button>' +
              '<pre id="boot-tech" style="display:none;width:100%;margin:0;text-align:left;background:' +
              p.techBg + ';border:1px solid ' + p.border + ';border-radius:10px;padding:10px 12px;' +
              'font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:' + p.text3 + ';' +
              'white-space:pre-wrap;word-break:break-word;max-height:180px;overflow:auto"></pre>' +
            '</div>';
          document.getElementById('boot-tech').textContent = details;

          var retryBtn = document.getElementById('boot-retry');
          if (retryBtn) retryBtn.onclick = hardReload;
          var reopenBtn = document.getElementById('boot-reopen');
          if (reopenBtn) reopenBtn.onclick = function () {
            try {
              var wa = window.Telegram && window.Telegram.WebApp;
              if (wa && typeof wa.close === 'function') { wa.close(); return; }
            } catch (e) {}
            hardReload(); // not in Telegram — a fresh load is the next best thing
          };
          var tech = document.getElementById('boot-tech');
          document.getElementById('boot-toggle').onclick = function () {
            tech.style.display = tech.style.display === 'none' ? 'block' : 'none';
          };
          // One-tap report: POST diagnostics to /api/boot-report, which forwards
          // them to the support Telegram chat. If that fails (offline, endpoint
          // unreachable) we fall back to copying the details to the clipboard so
          // the button is always useful.
          document.getElementById('boot-report').onclick = function () {
            var btn = this;
            btn.disabled = true; btn.style.opacity = '0.6';
            var sent = function () { btn.textContent = S.sent; btn.style.color = '#22c55e'; btn.style.opacity = '1'; };
            var copied = function () { btn.textContent = S.copied; btn.style.color = p.text1; btn.style.opacity = '1'; };
            var reset = function () { btn.disabled = false; btn.style.opacity = '1'; };
            var copy = function () {
              try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                  navigator.clipboard.writeText(details).then(copied, reset); return;
                }
              } catch (e) {}
              reset();
            };
            var initData = '';
            try { var wa = window.Telegram && window.Telegram.WebApp; initData = (wa && wa.initData) || ''; } catch (e) {}
            try {
              fetch('/api/boot-report', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ stage: window.__bootStage || '', ua: navigator.userAgent, details: details, initData: initData })
              }).then(function (r) { if (r && r.ok) { sent(); } else { copy(); } }, copy);
            } catch (e) { copy(); }
          };
        }
        // True once React has painted something into #root. After that the app
        // is running: the React error boundary owns render failures, so a stray
        // window error/rejection must not throw up the full recovery screen.
        function appMounted() {
          var root = document.getElementById('root');
          return !!(root && root.childNodes.length);
        }
        // ES5-safe cross-origin test — no URL constructor, which the old WebViews
        // this whole block exists for do not have.
        function foreignUrl(url) {
          var m = /^(?:[a-z][a-z0-9+.\-]*:)?\/\/([^/?#]+)/i.exec(url || '');
          return !!m && m[1].toLowerCase() !== location.host.toLowerCase();
        }
        window.addEventListener('error', function (e) {
          if (e.target && e.target.tagName) {
            // A broken <img> (content) or <link> (a blocked font stylesheet /
            // favicon) is never a boot failure — the bundle still runs. Images
            // are handled inline; ignore both here instead of hijacking the screen.
            if (e.target.tagName === 'IMG' || e.target.tagName === 'LINK') return;
            var url = e.target.src || e.target.href || '';
            if (/\/assets\/[^?#]+\.js(\?|#|$)/.test(url)) {
              if (engineTooOld) {
                // Not a stale hash — this engine cannot load module chunks at
                // all, and staleReload's loop guard would dead-end on the
                // wrong "close and reopen" screen. Show the real notice.
                errors.push('Failed to load: ' + url);
                report();
                return;
              }
              chunkLoadFailed(url);
              return;
            }
            // Only a script from OUR OWN origin can keep this app from booting.
            // Third-party ones cannot: Cloudflare injects its analytics beacon at
            // the edge, and any Android browser with a content blocker or a
            // filtering DNS kills it — that must not put an undismissable "App
            // failed to start" screen over an app that is running perfectly.
            if (foreignUrl(url)) return;
            if (appMounted()) return; // running app — a late resource isn't a boot failure
            errors.push('Failed to load: ' + (url || e.target.tagName));
          } else {
            if (appMounted()) return; // running app — let the error boundary/console handle it
            errors.push((e.message || 'script error') +
              (e.filename ? ' @ ' + e.filename + ':' + e.lineno : ''));
          }
          report();
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          if (appMounted()) return; // a stray rejection in a running app isn't a boot failure
          var r = e.reason;
          errors.push('unhandled rejection: ' + (r && (r.message || String(r))));
          report();
        });
        // A hashed chunk that fails to load is USUALLY a stale hash after a
        // redeploy — but the very same element error fires when the transfer
        // is dropped or times out (dead Wi-Fi, a reset on the Cloudflare
        // path, WebKit's 60s request timeout on a crawling link). Announcing
        // "A new version is available" and reloading into the same broken
        // link mis-tells the user AND whoever reads the report, and its loop
        // guard then dead-ends on "close and reopen". So ask the server first:
        // 404/410 → the hash is gone → stale reload; anything else → the
        // file is there and the CONNECTION is the story → recovery card,
        // with the answer in the details. Bounded: no answer in 6s counts as
        // a network failure, which on a link that dead is the truth anyway.
        function chunkLoadFailed(url) {
          var settled = false;
          function settle(status) {
            if (settled) return;
            settled = true;
            if (status === 404 || status === 410 || status === -1) { staleReload(); return; }
            errors.push('Failed to load: ' + url + (status
              ? ' (re-check: HTTP ' + status + ' - the file is on the server; the transfer was dropped, or this engine could not parse it)'
              : ' (re-check: no answer - the connection is dropping or timing out)'));
            report();
          }
          if (typeof fetch !== 'function') { settle(-1); return; } // can't tell — the old behaviour
          try {
            fetch(url, { method: 'HEAD', cache: 'no-store', credentials: 'same-origin' })
              .then(function (r) { settle(r ? r.status : 0); }, function () { settle(0); });
          } catch (e) { settle(0); }
          setTimeout(function () { settle(0); }, 6000);
        }
        // Calm "still loading" screen for a link that is slow, not dead. Yields
        // to the two screens that outrank it: the stale-version countdown and
        // an already painted recovery card (never downgrade a real error).
        function slowScreen() {
          if (window.__staleReloadStarted) return;
          if (document.getElementById('boot-tech') || document.getElementById('boot-slow')) return;
          var p = palette();
          ensureAnims();
          var S = BOOT_STRINGS[bootLang()];
          var box = bootBox();
          box.setAttribute('style',
            'position:fixed;top:0;right:0;bottom:0;left:0;z-index:99999;' +
            'display:flex;align-items:center;justify-content:center;' +
            'text-align:center;padding:24px;background:' + p.bg + ';color:' + p.text1 + ';' +
            "font:15px/1.6 -apple-system,BlinkMacSystemFont,'Inter',sans-serif");
          box.innerHTML = '<div id="boot-slow">' + brandedOverlay(p, true, S.slowTitle, S.slowMsg) + '</div>';
        }
        // The moment React paints, every boot screen is stale — including a
        // recovery card painted seconds earlier while the bundle was still on
        // its way down a slow link. Without this the user sits behind "App
        // failed to start" over an app that is running perfectly (the macOS
        // Telegram report of 2026-08-15). MutationObserver where the engine
        // has one; the watchdog below polls the same condition as the fallback.
        try {
          var rootEl = document.getElementById('root');
          if (rootEl && typeof MutationObserver === 'function') {
            var mo = new MutationObserver(function () {
              if (!appMounted()) return;
              mo.disconnect();
              dismissBootScreen();
            });
            mo.observe(rootEl, { childList: true });
          }
        } catch (e) {}
        // Boot watchdog. First look at 10s; from then on, once a second, until
        // the app mounts or a verdict is reached. The old single 10s timer
        // called every slow link a failure: nothing distinguishes "the bundle
        // is still coming" from "it came and never ran" except the resource
        // timeline, so that is what decides here —
        //   still downloading            → slow-connection screen, keep waiting (up to 60s)
        //   downloaded < 5s ago / running → give parse+eval and React a moment
        //   downloaded and silent        → recovery card ("downloaded but never ran")
        //   past 60s and still pending   → recovery card ("still downloading")
        // Without Resource Timing it behaves exactly as before (verdict at 10s).
        var WATCH_FIRST_MS = 10000, WATCH_CAP_MS = 60000, GRACE_MS = 5000;
        var verdictGiven = false, stageSeenAt = NaN;
        function nowMs() {
          return (window.performance && typeof performance.now === 'function') ? performance.now() : NaN;
        }
        function watch() {
          if (window.__staleReloadStarted) return 'stop';
          if (appMounted()) { dismissBootScreen(); return 'stop'; }
          if (verdictGiven || errors.length) return; // a card is up or coming — keep watching only for a late mount
          var now = nowMs();
          var g = isNaN(now) ? null : graphStatus(); // no clock to compare against → old behaviour
          if (window.__bootStage && isNaN(stageSeenAt)) stageSeenAt = now;
          var waitReason = null;
          if (g && !g.done) waitReason = (now > WATCH_CAP_MS) ? null : 'downloading';
          else if (g && g.done && !window.__bootStage && (now - g.lastEnd) < GRACE_MS) waitReason = 'evaluating';
          else if (window.__bootStage && (now - stageSeenAt) < GRACE_MS) waitReason = 'rendering';
          if (waitReason) { slowScreen(); return; }
          verdictGiven = true;
          errors.push(!g ? 'No JS error captured - bundle did not load or did not run.'
            : window.__bootStage ? 'No JS error captured - bundle ran (see stage) but React never painted.'
            : g.done ? 'No JS error captured - bundle fully downloaded but never ran.'
            : 'No JS error captured - bundle still downloading after ' + Math.round(now / 1000) +
              's (pending: ' + g.pending.join(', ') + ').');
          report();
        }
        setTimeout(function () {
          if (watch() === 'stop') return;
          var iv = setInterval(function () { if (watch() === 'stop') clearInterval(iv); }, 1000);
        }, WATCH_FIRST_MS);
      })();
    </script>
  </body>
